# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
# This workflow will build a Java project with Gradle and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-gradle

name: Java CI with Gradle

on:
  workflow_dispatch:
  push:
    branches: [ "1.21.1", "fix_mcMMO_repair/salvage" ]
  pull_request:
    branches: [ "1.21.1", "fix_mcMMO_repair/salvage" ]
    
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
  
jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0   # 之後要 git commit/push 必須拿到歷史
        
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Gradle (cache)
      uses: gradle/actions/setup-gradle@v4

    # Configure Gradle for optimal use in GitHub Actions, including caching of downloaded dependencies.
    # See: https://github.com/gradle/actions/blob/main/setup-gradle/README.md
    - name: Setup Gradle
      run: |
        chmod +x ./gradlew
        ./gradlew setup
        
    - name: Apply Mojang patches (decompile+patch)
      run: ./gradlew youer:applyPatches

    - name: Inject guard into ServerGamePacketListenerImpl.java
      shell: bash
      run: |
        set -euo pipefail
        T=projects/youer/src/main/java/net/minecraft/server/network/ServerGamePacketListenerImpl.java

        if grep -q 'OLDIP fix (Youer #117)' "$T"; then
          echo "Guard already present, skipping injection."
          exit 0
        fi

        # 先找「int <SEQINT> = <SEQVAR>.getSequence();」左邊變數名稱
        SEQINT=$(grep -Pom1 'int\s+([A-Za-z_][A-Za-z0-9_]*)\s*=\s*[A-Za-z_][A-Za-z0-9_]*\.getSequence\(\);' "$T" \
                 | sed -E 's/int\s+([A-Za-z_][A-Za-z0-9_]*)\s*=.*/\1/')
        # 再找「<SEQVAR>.getSequence()」裡的變數名稱
        SEQVAR=$(grep -Po '[A-Za-z_][A-Za-z0-9_]*\.getSequence\(\)' "$T" | head -n1 | sed -E 's/\.getSequence\(\)//')

        if [[ -n "${SEQINT:-}" ]]; then
          ACKARG="$SEQINT"
        elif [[ -n "${SEQVAR:-}" ]]; then
          ACKARG="${SEQVAR}.getSequence()"
        else
          echo "Cannot locate sequence variable in $T"; exit 1
        fi

        # 確認錨點存在（useItemOn 呼叫）
        grep -n '\.useItemOn(this\.player, serverlevel, itemstack, interactionhand, blockhitresult);' "$T"

        awk -v ACKARG="$ACKARG" '
          { print }
          /\.useItemOn\(this\.player, serverlevel, itemstack, interactionhand, blockhitresult\);/ && !injected {
            print "                                 // OLDIP fix (Youer #117): avoid armor auto-equip & dupes on iron/gold blocks"
            print "                                 // If block interaction consumed the action, do NOT fall back to air-use."
            print "                                 // ACK the sequence and sync inventory to avoid client resends/ghosts."
            print "                                 if (interactionresult.consumesAction()) {"
            print "                                     this.ackBlockChangesUpTo(" ACKARG ");"
            print "                                     this.player.containerMenu.broadcastChanges();"
            print "                                     return;"
            print "                                 }"
            print "                                 // Guard: holding armor and clicking iron/gold blocks should not run armor air-use."
            print "                                 if (itemstack.getItem() instanceof net.minecraft.world.item.ArmorItem"
            print "                                         && (serverlevel.getBlockState(blockpos).is(net.minecraft.world.level.block.Blocks.IRON_BLOCK)"
            print "                                         || serverlevel.getBlockState(blockpos).is(net.minecraft.world.level.block.Blocks.GOLD_BLOCK))) {"
            print "                                     this.ackBlockChangesUpTo(" ACKARG ");"
            print "                                     this.player.containerMenu.broadcastChanges();"
            print "                                     this.player.swing(interactionhand, true);"
            print "                                     return;"
            print "                                 }"
            injected=1
          }
        ' "$T" > "$T.new"
        mv "$T.new" "$T"

    - name: Generate patches
      run: ./gradlew genPatches

    - name: Commit regenerated patch (optional)
      if: ${{ github.event_name != 'pull_request' }}
      run: |
        set -e
        git status --porcelain
        if ! git diff --quiet -- patches/net/minecraft/server/network/ServerGamePacketListenerImpl.java.patch; then
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add patches/net/minecraft/server/network/ServerGamePacketListenerImpl.java.patch
          git commit -m "fix(youer): guard armor fallback on iron/gold + ACK to prevent dupes (Fixes #117)"
          git push
        else
          echo "No patch changes to commit."
        fi

    - name: Build with Gradle Wrapper
      run: ./gradlew youerJar

    - name: Upload a Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Youer-1.21.1-server
        path: projects/youer/build/libs/*-server.jar
